<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нейродолина</title>
<script src="telegram-web-app.js"></script>
<style>
  :root{
    --bg:#3a2a5c; --card:rgba(18,12,34,.58); --line:rgba(255,255,255,.22);
    --text:#FFFFFF; --muted:rgba(255,255,255,.82); --accent:#FFD9A8; --accent-text:#2a1c3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;color:var(--text)}
  .bg{position:fixed;inset:0;z-index:-2;overflow:hidden;
      background:linear-gradient(160deg,#4a3380 0%,#7a4a8c 45%,#d08a7a 100%)}
  .bg.photo{background-size:cover;background-position:center}
  .bg.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,10,30,.4),rgba(15,10,30,.7))}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
  .b1{width:320px;height:320px;background:#6fa8ff;top:-80px;left:-100px;animation:f1 16s ease-in-out infinite alternate}
  .b2{width:360px;height:360px;background:#ff9ec4;bottom:-120px;right:-120px;animation:f2 19s ease-in-out infinite alternate}
  .b3{width:240px;height:240px;background:#ffd28a;top:40%;left:55%;animation:f3 22s ease-in-out infinite alternate}
  @keyframes f1{to{transform:translate(120px,160px)}}
  @keyframes f2{to{transform:translate(-140px,-120px)}}
  @keyframes f3{to{transform:translate(-160px,90px)}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    font-weight:300;line-height:1.45;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 40px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:400}
  h1{font-size:34px;line-height:1.1;font-weight:200;margin:10px 0 12px;letter-spacing:-.01em}
  .lead{color:var(--muted);font-size:16px;margin:0 0 24px}
  .hero{background:rgba(18,12,34,.6);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:28px}
  .hero h2{font-size:20px;font-weight:300;margin:0 0 8px}
  .hero p{margin:0 0 18px;color:var(--muted);font-size:15px}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-text);
       font-weight:500;font-size:16px;padding:16px;border-radius:14px;min-height:52px}
  .btn:active{opacity:.85}
  .section{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
        background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:64px}
  .card:active{background:rgba(255,255,255,.2)}
  .num{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);
       display:flex;align-items:center;justify-content:center;font-size:14px}
  .body{flex:1;min-width:0}
  .title{font-size:16px;font-weight:400}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .badge{font-size:11px;background:var(--accent);color:var(--accent-text);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;font-weight:500}
  .arrow{flex:none;color:var(--muted);font-size:20px}
  footer{margin-top:32px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="bg" id="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div class="wrap">
  <div class="kicker" id="kicker"></div>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>

  <div class="hero">
    <h2 id="heroTitle"></h2>
    <p id="heroText"></p>
    <a class="btn" id="heroBtn" href="#"></a>
  </div>

  <div class="section" id="sectionTitle"></div>
  <div class="list" id="list"></div>

  <footer id="footer"></footer>
</div>

<script>
// ===== меняете только этот блок =====
window.KK_DATA = {
  kicker: "Нейродолина · обучение ИИ",
  title: "Выбери, что хочешь\nсделать с ИИ",
  lead: "Нажми на задачу, и откроется нужная тема группы.",
  hero: {
    title: "Первый раз здесь?",
    text: "В теме «Старт» коротко: как устроена группа и с чего начать.",
    button: "Открыть «Старт»",
    url: "https://t.me/c/4475179187/12"
  },
  sectionTitle: "Что хочешь сделать?",
  cards: [
    { title: "Фото со своим лицом",        sub: "Нейрофотосессии: лицо, позы, ракурсы",   url: "https://t.me/c/4475179187/7", badge: "" },
    { title: "Мультфильм из своей идеи",   sub: "Киностудия: от сценария до видео",       url: "https://t.me/c/4475179187/6", badge: "" },
    { title: "Поправить готовый кадр",     sub: "Ретушь с ИИ",                            url: "https://t.me/c/4475179187/3", badge: "" },
    { title: "Писать и думать вместе с ИИ", sub: "Лаборатория Claude",                    url: "https://t.me/c/4475179187/5", badge: "" },
    { title: "Свой ИИ-помощник",           sub: "Мастерская ИИ-помощников",               url: "https://t.me/c/4475179187/4", badge: "" },
    { title: "Попробовать бесплатно",      sub: "Инструменты, за которые не нужно платить", url: "https://t.me/c/4475179187/2", badge: "" },
    { title: "Что получилось у других",    sub: "Результаты участников",                    url: "https://t.me/c/4475179187/8", badge: "" },
    { title: "Не получается? Спроси",     sub: "Вопросы и помощь",                       url: "https://t.me/c/4475179187/9", badge: "" },
    { title: "Создать такое же приложение", sub: "Пошаговый урок: собираем с Claude",  url: "https://t.me/c/4475179187/106", badge: "новое" }
  ],
  bg: "bg.jpg",   // фото-фон; пусто = цветной градиент
  footer: "Яна · Нейродолина"
};
// ===== дальше код трогать не нужно =====

(function(){
  var D = window.KK_DATA;
  var tg = window.Telegram && window.Telegram.WebApp;
  var h = location.hash + location.search;
  var inTg = /tgWebApp/.test(h) || !!window.TelegramWebviewProxy ||
             !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction);

  function $(id){return document.getElementById(id)}
  $("kicker").textContent = D.kicker;
  $("h1").innerHTML = D.title.split("\n").map(function(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}).join("<br>");
  $("lead").textContent = D.lead;
  $("heroTitle").textContent = D.hero.title;
  $("heroText").textContent = D.hero.text;
  var hb = $("heroBtn"); hb.textContent = D.hero.button; hb.href = D.hero.url; hb.dataset.url = D.hero.url;
  $("sectionTitle").textContent = D.sectionTitle;
  $("footer").textContent = D.footer;
  if(D.bg){var bg=$("bg");bg.classList.add("photo");bg.style.backgroundImage="url("+D.bg+")";bg.querySelectorAll(".blob").forEach(function(b){b.remove()})}

  var list = $("list");
  D.cards.forEach(function(c,i){
    var a = document.createElement("a");
    a.className = "card"; a.href = c.url; a.dataset.url = c.url;
    var num = document.createElement("div"); num.className="num"; num.textContent = i+1;
    var body = document.createElement("div"); body.className="body";
    var t = document.createElement("div"); t.className="title"; t.textContent = c.title;
    if(c.badge){var b=document.createElement("span");b.className="badge";b.textContent=c.badge;t.appendChild(b)}
    var s = document.createElement("div"); s.className="sub"; s.textContent = c.sub;
    body.appendChild(t); body.appendChild(s);
    var ar = document.createElement("div"); ar.className="arrow"; ar.textContent="›";
    a.appendChild(num); a.appendChild(body); a.appendChild(ar);
    list.appendChild(a);
  });

  var links = document.querySelectorAll("a[data-url]");
  links.forEach(function(a){ a.target = inTg ? "_self" : "_blank"; if(!inTg) a.rel="noopener"; });

  if(tg){
    try{ tg.ready(); tg.expand(); tg.setHeaderColor("#4a3380"); tg.setBackgroundColor("#4a3380"); }catch(e){}
  }

  function sendRaw(ev, data){
    var s = JSON.stringify(data||{});
    if(window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) window.TelegramWebviewProxy.postEvent(ev, s);
    else if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction)
      window.webkit.messageHandlers.performAction.postMessage({eventType:ev, eventData:s});
  }

  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest("a[data-url]");
    if(!a || !inTg) return;          // в обычном браузере ссылки открываются сами
    e.preventDefault();
    var url = a.dataset.url;
    var isTg = url.indexOf("https://t.me/") === 0;
    try{ if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); }catch(_){}
    if(tg){
      if(isTg){ tg.close(); tg.openTelegramLink(url); }   // порядок важен: сначала close
      else { tg.openLink(url); }
    } else {
      if(isTg){ sendRaw("web_app_close"); sendRaw("web_app_open_tg_link", {path_full: url.replace("https://t.me","")}); }
      else { sendRaw("web_app_open_link", {url:url}); }
    }
  });
})();
</script>
</body>
</html>
